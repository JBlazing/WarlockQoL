# Warlock QoL: build and publish to CurseForge.
#
# How a release works:
#   1. Bump "## Version:" in WarlockQoL/WarlockQoL.toc and commit.
#   2. Push a matching tag:  git tag -a v2.4.1 -m "What changed" && git push origin v2.4.1
#   3. This pipeline checks the code, zips the addon and uploads it to CurseForge.
#      The CurseForge app then offers the new version to everyone who has the addon.
#
# Tag suffix decides the CurseForge release type:
#   v2.4.1          -> release
#   v2.4.1-beta.1   -> beta
#   v2.4.1-alpha.1  -> alpha
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CF_API_TOKEN    CurseForge API token (masked + protected)
#   CF_PROJECT_ID   CurseForge project ID (shown in the project's "About" box)
# Optional:
#   CF_GAME_VERSION_IDS  Comma-separated CurseForge game version IDs. Set this if the
#                        automatic lookup from the TOC's ## Interface can't find a match.
#   CF_DRY_RUN=1         Build everything but skip the actual upload.

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - package
  - publish

default:
  image: alpine:3.20
  interruptible: true
  before_script:
    - apk add --no-cache bash curl jq zip git lua5.1 >/dev/null

variables:
  ADDON_DIR: WarlockQoL
  GIT_DEPTH: 0 # full history so the changelog can find the previous tag

lint:
  stage: validate
  script:
    - bash ci/validate.sh

package:
  stage: package
  script:
    - bash ci/package.sh
  artifacts:
    name: "$ADDON_DIR-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 30 days

curseforge:
  stage: publish
  needs: [package]
  interruptible: false
  resource_group: curseforge # never run two uploads at once
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)?$/
  script:
    - bash ci/upload-curseforge.sh
