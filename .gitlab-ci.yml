# Warlock QoL: build and publish to CurseForge.
#
# One-click release: open any main pipeline and press play on release:patch, release:minor
# or release:major. It bumps the .toc, commits, and tags vX.Y.Z (a CurseForge "release").
#
# Releasing from GitLab with options: Build > Pipelines > Run pipeline on main, set "release" to true and
# pick bump/channel. The release job bumps the version, commits, and pushes the tag, which
# starts the publish pipeline below. (Needs RELEASE_DEPLOY_KEY or RELEASE_TOKEN, see RELEASING.md.)
#
# Releasing from your PC: scripts/release.sh does steps 1-2 for you, e.g.
# `bash scripts/release.sh patch --beta`; run it with -h for options.
#
# How a release works:
#   1. Bump "## Version:" in WarlockQoL/WarlockQoL.toc and commit.
#   2. Push a matching tag:  git tag -a v2.4.1 -m "What changed" && git push origin v2.4.1
#   3. This pipeline checks the code, zips the addon and uploads it to CurseForge.
#      The CurseForge app then offers the new version to everyone who has the addon.
#
# Tag suffix decides the CurseForge release type:
#   v2.4.1          -> release
#   v2.4.1-beta.1   -> beta
#   v2.4.1-alpha.1  -> alpha
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CF_API_TOKEN    CurseForge API token (masked + protected)
#   CF_PROJECT_ID   CurseForge project ID (shown in the project's "About" box)
# Optional:
#   CF_GAME_VERSION_IDS  Comma-separated CurseForge game version IDs. Set this if the
#                        automatic lookup from the TOC's ## Interface can't find a match.
#   CF_DRY_RUN=1         Build everything but skip the actual upload.
#   HUB_MIRROR           Registry the job image is pulled through. Defaults to the Docker
#                        Hub pull-through cache on the Pi (/opt/docker-reg, port 5001).
#                        The Pi's rootless Podman does the pull, so "localhost" means the
#                        Pi itself, not the runner container. Podman must list it as an
#                        insecure registry (~/.config/containers/registries.conf.d/).
#                        The cache fills itself on first pull.
#   RELEASE_DEPLOY_KEY   Private key of a write-access deploy key (File variable, or base64 on
#                        one line so it can be masked). The release jobs push the version
#                        commit and tag with it over SSH.
#   RELEASE_TOKEN        Fallback: access token with write_repository, pushed over HTTPS.
#   GITHUB_REPO          owner/name of a GitHub repo. When set, tag pipelines also publish a
#                        GitHub release there (needs GITHUB_TOKEN; GH_DRY_RUN=1 to test).
#
# The inputs below only matter for a manual "Run pipeline"; pushes and tags use the defaults.

spec:
  inputs:
    release:
      type: boolean
      default: false
      description: "Cut a release from main: bump the version, commit and tag it."
    bump:
      options: [patch, minor, major, none]
      default: patch
      description: "Version bump. 'none' tags the current .toc version (next beta, or final after betas)."
    channel:
      options: [beta, alpha, prod]
      default: beta
      description: "CurseForge release type. beta/alpha tag vX.Y.Z-beta.N; prod tags vX.Y.Z."
    message:
      type: string
      default: ""
      description: "Changelog for CurseForge. Leave empty to list the commits since the last tag."
---

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - release
  - package
  - publish

default:
  image: ${HUB_MIRROR}/library/alpine:3.20
  interruptible: true
  before_script:
    - apk add --no-cache bash curl jq zip git lua5.1 >/dev/null

variables:
  HUB_MIRROR: localhost:5001
  ADDON_DIR: WarlockQoL
  GIT_DEPTH: 0 # full history so the changelog can find the previous tag
  RELEASE: "$[[ inputs.release ]]"

lint:
  stage: validate
  script:
    - bash ci/validate.sh

# Both kinds of release job push a tag; the tag's own pipeline does the packaging and
# CurseForge upload.
.cut-release:
  stage: release
  needs: [lint]
  interruptible: false
  resource_group: release # never cut two releases at once
  before_script:
    - apk add --no-cache bash curl jq zip git lua5.1 openssh-client >/dev/null
  script:
    - bash ci/cut-release.sh

# Manual release: only from "Run pipeline" (or the API) on the default branch with release=true.
release:
  extends: .cut-release
  rules:
    - if: $RELEASE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(web|api)$/
  variables:
    RELEASE_BUMP: $[[ inputs.bump ]]
    RELEASE_CHANNEL: $[[ inputs.channel ]]
    RELEASE_MESSAGE: $[[ inputs.message ]]

# One-click release: every normal main pipeline gets play buttons that bump the .toc to the
# next version (patch/minor/major), commit it and push the vX.Y.Z tag (CurseForge "release").
# The changelog is the commits since the last final release. They're optional, so the
# pipeline still passes if nobody presses them, and they refuse to run if main has moved on.
.release-button:
  extends: .cut-release
  rules:
    - if: $RELEASE != "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    RELEASE_CHANNEL: prod
    RELEASE_MESSAGE: ""

release:patch:
  extends: .release-button
  variables:
    RELEASE_BUMP: patch

release:minor:
  extends: .release-button
  variables:
    RELEASE_BUMP: minor

release:major:
  extends: .release-button
  variables:
    RELEASE_BUMP: major

package:
  stage: package
  rules:
    - if: $RELEASE == "true"
      when: never # a release run only tags; the tag pipeline builds the zip
    - when: on_success
  script:
    - bash ci/package.sh
  artifacts:
    name: "$ADDON_DIR-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 30 days

curseforge:
  stage: publish
  needs: [package]
  interruptible: false
  resource_group: curseforge # never run two uploads at once
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)?$/
  script:
    - bash ci/upload-curseforge.sh

# GitHub release for the same tag: pushes the tag to GitHub, creates the release with the
# changelog, attaches the zip. Only runs once GITHUB_REPO is set (see RELEASING.md).
github:
  stage: publish
  needs: [package]
  interruptible: false
  resource_group: github
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-(alpha|beta)(\.\d+)?)?$/ && $GITHUB_REPO
  script:
    - bash ci/upload-github.sh
