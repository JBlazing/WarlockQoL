<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Soul Shard">
  <title>Soul Shard</title>
  <defs>
    <!-- Badge background -->
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#3a1a5c"/>
      <stop offset="0.55" stop-color="#1c0b30"/>
      <stop offset="1" stop-color="#0a0412"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6bc4"/>
      <stop offset="0.5" stop-color="#4b2a75"/>
      <stop offset="1" stop-color="#1b0d2c"/>
    </linearGradient>

    <!-- Halo behind the shard -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c77dff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#8a2be2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5a189a" stop-opacity="0"/>
    </radialGradient>

    <!-- Facet fills -->
    <linearGradient id="fLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9ff"/>
      <stop offset="0.35" stop-color="#c77dff"/>
      <stop offset="1" stop-color="#6a1fb0"/>
    </linearGradient>
    <linearGradient id="fRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d4edd"/>
      <stop offset="0.6" stop-color="#4c1380"/>
      <stop offset="1" stop-color="#240845"/>
    </linearGradient>
    <linearGradient id="fCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#e0aaff"/>
      <stop offset="0.7" stop-color="#9d4edd"/>
      <stop offset="1" stop-color="#5a189a"/>
    </linearGradient>
    <linearGradient id="fBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b2cbf"/>
      <stop offset="1" stop-color="#2a0a4a"/>
    </linearGradient>

    <!-- Trapped soul glow inside the crystal -->
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#f0c6ff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="shardClip">
      <path d="M128 30 L160 92 L150 196 L128 226 L104 194 L94 96 Z"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="6" y="6" width="244" height="244" rx="40" fill="url(#rim)"/>
  <rect x="12" y="12" width="232" height="232" rx="35" fill="url(#bg)"/>

  <!-- Halo -->
  <circle cx="128" cy="130" r="100" fill="url(#halo)"/>

  <!-- Soul wisps spiralling around the shard -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M70 186 C 40 150, 60 92, 104 78" stroke="#c77dff" stroke-width="3" stroke-opacity="0.75"/>
    <path d="M188 70 C 220 110, 202 168, 156 184" stroke="#e0aaff" stroke-width="2.5" stroke-opacity="0.65"/>
    <path d="M84 206 C 120 222, 170 214, 196 186" stroke="#9d4edd" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Shard shadow/glow -->
  <path d="M128 30 L160 92 L150 196 L128 226 L104 194 L94 96 Z" fill="#b5179e" opacity="0.55" filter="url(#soft)"/>

  <!-- Shard facets -->
  <g stroke="#2a0a4a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M128 30 L94 96 L112 110 Z" fill="url(#fLeft)"/>
    <path d="M128 30 L112 110 L140 108 Z" fill="url(#fCenter)"/>
    <path d="M128 30 L140 108 L160 92 Z" fill="url(#fRight)"/>
    <path d="M94 96 L104 194 L118 170 L112 110 Z" fill="url(#fLeft)"/>
    <path d="M112 110 L118 170 L136 172 L140 108 Z" fill="url(#fCenter)"/>
    <path d="M140 108 L136 172 L150 196 L160 92 Z" fill="url(#fRight)"/>
    <path d="M104 194 L128 226 L118 170 Z" fill="url(#fBase)"/>
    <path d="M118 170 L128 226 L136 172 Z" fill="#6a1fb0"/>
    <path d="M136 172 L128 226 L150 196 Z" fill="#2a0a4a"/>
  </g>

  <!-- Trapped soul inside -->
  <g clip-path="url(#shardClip)">
    <ellipse cx="126" cy="140" rx="26" ry="40" fill="url(#core)"/>
    <path d="M126 112 C 112 124, 140 134, 124 148 C 112 158, 134 166, 126 176"
          fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Edge highlights -->
  <g fill="none" stroke-linecap="round">
    <path d="M128 32 L96 96" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M96 98 L105 190" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.45"/>
    <path d="M128 32 L113 108" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff" filter="url(#glow)">
    <path d="M118 50 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z"/>
    <path d="M178 120 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5 Z" opacity="0.85"/>
    <path d="M66 132 l1.2 3.6 3.6 1.2 -3.6 1.2 -1.2 3.6 -1.2 -3.6 -3.6 -1.2 3.6 -1.2 Z" opacity="0.75"/>
    <circle cx="190" cy="196" r="1.8" opacity="0.7"/>
    <circle cx="58" cy="78" r="1.5" opacity="0.6"/>
    <circle cx="200" cy="58" r="1.2" opacity="0.6"/>
  </g>
</svg>
